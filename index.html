t\"]\n22:I[484,[],\"ViewportBoundary\"]\n24:I[484,[],\"MetadataBoundary\"]\n25:\"$Sreact.suspense\"\na:[\"$\",\"div\",null,{\"className\":\"hidden md:block\",\"children\":[\"$\",\"$L13\",null,{}]}]\nb:[\"$\",\"div\",null,{\"className\":\"hidden md:block\",\"children\":[\"$\",\"$L14\",null,{}]}]\nc:[\"$\",\"div\",null,{\"className\":\"md:hidden block\",\"children\":[\"$\",\"$L15\",null,{}]}]\nd:[\"$\",\"div\",null,{\"className\":\"hidden md:block\",\"children\":[\"$\",\"$L16\",null,{}]}]\ne:[\"$\",\"style\",null,{\"suppressHydrationWarning\":true,\"dangerouslySetInnerHTML\":{\"__html\":\"\\n              @keyframes gradientMove { \\n                0% { background-position: 0% 50%; } \\n                50% { background-position: 100% 50%; } \\n                100% { background-position: 0% 50%; } \\n              }\\n            \"}}]\nf:[\"$\",\"div\",null,{\"className\":\"hidden md:block\",\"children\":[\"$\",\"$L17\",null,{}]}]\n1c:T4652,"])</script><script>self.__next_f.push([1,"\r\n# TEA 家族：TEA、XTEA、XXTEA 原理与逆向识别\r\n\r\n\u003e TEA 这一家子很适合放在一起看。最早的 TEA 追求的就是“小”，核心操作只有加法、异或和移位；XTEA 在它的基础上改了 key 的使用方式；XXTEA 又把两个 32 位 word 的处理扩展到一整串 word。逆向题喜欢它们也不奇怪，常量醒目，代码不长，稍微改几个参数就能变成一道新题。\r\n\r\nTEA 和 XTEA 都是 64 bit block，差别主要在 key 下标怎么取；XXTEA 则不再是两个 word 对着转，而是把整个 `uint32_t` 数组作为一个大块来搅。\r\n\r\n## 实战识别\r\n\r\nTEA 家族最适合从常量下手。反编译窗口里搜 `0x9e3779b9`，有时也会搜到 `0x61c88647` 或 `0xC6EF3720`。只要搜到了，再去看附近有没有 `\u003c\u003c 4`、`\u003e\u003e 5`、`sum`、四个 32 位 key。看到这些东西，不用急着细分，先把它当 TEA 家族处理。\r\n\r\n接下来才区分具体是哪一个。key 下标固定在 `k0/k1/k2/k3` 的，多半是 TEA；出现 `sum \u0026 3`、`(sum \u003e\u003e 11) \u0026 3` 的，多半是 XTEA；出现 `6 + 52 / n`、`MX` 那种一长串 `z/y/sum/p/e` 混合表达式的，就往 XXTEA 想。新手最容易卡在大小端和轮数上，尤其是 x86 程序直接把 `char *` 强转成 `uint32_t *` 时，基本就是小端，不要拿大端脚本硬跑。\r\n\r\n逆向时不用给变量名太大压力。IDA 可能把 `v0/v1` 叫成 `v7/v8`，把 key 数组叫成 `a2`，这不影响理解。你只要把“两个 32 位数据 word、四个 32 位 key word、sum 怎么变化、循环几次”抄准，后面 Python 复现就能慢慢调出来。\r\n\r\n新手做这类题不要一开始就想着“我要完全理解密码学证明”。更实际的目标是把二进制里的加密函数还原到脚本里。先让脚本对上一组输入输出，再去谈是不是 TEA、XTEA 或 XXTEA。\r\n\r\n## 1. 家族总览\r\n\r\n算法数据单位密钥常见轮数逆向识别点主要意义TEA64 bit，两个 `uint32_t`128 bit32 cycles`0x9e3779b9`、`\u003c\u003c4`、`\u003e\u003e5`、固定 `k0..k3`最初的 Tiny Encryption AlgorithmXTEA64 bit，两个 `uint32_t`128 bit32 rounds`sum \u0026 3`、`(sum \u003e\u003e 11) \u0026 3`改进 TEA 的 key 调度XXTEAn 个 `uint32_t`，n \u003e= 2128 bit`6 + 52 // nMX`、`z/y/sum/e/p`、`6+52/n`宽分组，修正 Block TEA\r\n\r\n这三个算法的底子是一样的：都吃 128 bit key，都在 32 位无符号整数上做加法、异或和移位，也都绕不开 `delta = 0x9e3779b9`。它们没有像 AES 那样在库里形成特别统一的“模式 + padding”封装，所以 CTF 里一定要贴着题目实现走。Python 复现时尤其要记得 `\u0026 0xffffffff`，不然 C 里的自然溢出在 Python 里不会自动发生。\r\n\r\n最重要的区别：\r\n\r\n```\r\nTEA/XTEA: 每次处理 8 字节 block\r\nXXTEA:    把整个 uint32_t 数组作为一个大 block\r\n```\r\n\r\n## 2. 算法详解前的共同基础\r\n\r\n### 2.1 32 位溢出\r\n\r\nC 里的 `uint32_t` 会自然溢出：\r\n\r\n```\r\nuint32_t x = 0xffffffff;\r\nx += 1;  /* x == 0 */\r\n```\r\n\r\nPython 整数不会溢出，所以 TEA 家族脚本必须写：\r\n\r\n```\r\nx = (x + y) \u0026 0xffffffff\r\n```\r\n\r\n忘记掩码是这类脚本里最容易犯的错。表面上代码还在跑，输出也有十六进制，但和题目里的 C 程序已经不是同一个算法了。\r\n\r\n### 2.2 delta\r\n\r\n```\r\ndelta = 0x9e3779b9\r\n```\r\n\r\n标准 TEA/XTEA 32 轮解密时的 sum：\r\n\r\n```\r\n0xC6EF3720 = 0x9e3779b9 * 32 mod 2^32\r\n```\r\n\r\n逆向里也常见：\r\n\r\n```\r\n0x61c88647 = 2^32 - 0x9e3779b9\r\n```\r\n\r\n出现这个值也要想到 TEA 家族，因为有些代码用减法维护 `sum`。\r\n\r\n### 2.3 字节序\r\n\r\n算法处理的是 `uint32_t`，题目给的是 bytes。必须确认大小端：\r\n\r\n```\r\nstruct.unpack(\"\u003c2I\", block)  # 小端\r\nstruct.unpack(\"\u003e2I\", block)  # 大端\r\n```\r\n\r\n逆向题如果看到 `uint32_t *p = (uint32_t *)buf`，在 x86/x64 上通常是小端。\r\n\r\n## 3. TEA\r\n\r\n### 3.1 参数\r\n\r\n项目内容分组长度64 bit密钥长度128 bit状态`v0, v1`key`k0, k1, k2, k3`标准轮数32 cycles\r\n\r\n### 3.2 加密流程\r\n\r\n```\r\nsum = 0\r\nrepeat 32:\r\n    sum += delta\r\n    v0 += ((v1 \u003c\u003c 4) + k0) XOR (v1 + sum) XOR ((v1 \u003e\u003e 5) + k1)\r\n    v1 += ((v0 \u003c\u003c 4) + k2) XOR (v0 + sum) XOR ((v0 \u003e\u003e 5) + k3)\r\n```\r\n\r\nTEA 的 key 使用方式很死板，更新 `v0` 用 `k0/k1`，更新 `v1` 用 `k2/k3`。这种固定感就是它和 XTEA 的一个分界。\r\n\r\n### 3.3 解密流程\r\n\r\n```\r\nsum = delta * 32\r\nrepeat 32:\r\n    v1 -= ((v0 \u003c\u003c 4) + k2) XOR (v0 + sum) XOR ((v0 \u003e\u003e 5) + k3)\r\n    v0 -= ((v1 \u003c\u003c 4) + k0) XOR (v1 + sum) XOR ((v1 \u003e\u003e 5) + k1)\r\n    sum -= delta\r\n```\r\n\r\n解密顺序别写反。加密最后一步更新的是 `v1`，所以解密要先把 `v1` 减回去，再处理 `v0`。\r\n\r\n### 3.4 TEA 识别点\r\n\r\n```\r\n0x9e3779b9\r\n循环 32 次\r\n两个 uint32_t\r\n四个 uint32_t key\r\n\u003c\u003c 4\r\n\u003e\u003e 5\r\n固定 k0/k1/k2/k3\r\n```\r\n\r\n## 4. XTEA\r\n\r\n### 4.1 XTEA 改了什么\r\n\r\nTEA 的 key 下标固定，XTEA 把 key 下标和 `sum` 绑定：\r\n\r\n```\r\nkey[sum \u0026 3]\r\nkey[(sum \u003e\u003e 11) \u0026 3]\r\n```\r\n\r\n所以 XTEA 逆向特征比 TEA 更明显。\r\n\r\n### 4.2 加密流程\r\n\r\n```\r\nsum = 0\r\nrepeat rounds:\r\n    v0 += (((v1 \u003c\u003c 4) XOR (v1 \u003e\u003e 5)) + v1) XOR (sum + key[sum \u0026 3])\r\n    sum += delta\r\n    v1 += (((v0 \u003c\u003c 4) XOR (v0 \u003e\u003e 5)) + v0) XOR (sum + key[(sum \u003e\u003e 11) \u0026 3])\r\n```\r\n\r\n### 4.3 解密流程\r\n\r\n```\r\nsum = delta * rounds\r\nrepeat rounds:\r\n    v1 -= (((v0 \u003c\u003c 4) XOR (v0 \u003e\u003e 5)) + v0) XOR (sum + key[(sum \u003e\u003e 11) \u0026 3])\r\n    sum -= delta\r\n    v0 -= (((v1 \u003c\u003c 4) XOR (v1 \u003e\u003e 5)) + v1) XOR (sum + key[sum \u0026 3])\r\n```\r\n\r\n### 4.4 TEA 与 XTEA 的关键对照\r\n\r\n项目TEAXTEAblock64 bit64 bitkey128 bit128 bitkey 下标固定随 `sum` 变化强特征`k0/k1/k2/k3sum\u00263`、`sum\u003e\u003e11\u00263`轮数口径32 cycles常见 32 rounds\r\n\r\n如果只看到 `delta`、`\u003c\u003c4`、`\u003e\u003e5`，还不能直接判断 TEA，要继续看 key 下标。\r\n\r\n## 5. XXTEA\r\n\r\n### 5.1 XXTEA 和 TEA/XTEA 的关系\r\n\r\nTEA/XTEA 处理：\r\n\r\n```\r\n[v0, v1]\r\n```\r\n\r\nXXTEA 处理：\r\n\r\n```\r\n[v0, v1, v2, ..., v(n-1)]\r\n```\r\n\r\n它不是 8 字节一组独立加密，而是整个 word 数组一起扩散。\r\n\r\n### 5.2 轮数\r\n\r\n```\r\nrounds = 6 + 52 // n\r\n```\r\n\r\n`n` 是 32 位 word 数。看到 `6 + 52 / n` 基本就是 XXTEA。\r\n\r\n### 5.3 MX 函数\r\n\r\n常见宏：\r\n\r\n```\r\n#define MX (((z \u003e\u003e 5 ^ y \u003c\u003c 2) + (y \u003e\u003e 3 ^ z \u003c\u003c 4)) ^ ((sum ^ y) + (key[(p \u0026 3) ^ e] ^ z)))\r\n```\r\n\r\n这里的变量名看着短，其实分工很明确：`y` 是右侧 word，`z` 是左侧或者上一个已经更新过的 word，`p` 是当前下标，`e` 来自 `(sum \u003e\u003e 2) \u0026 3`，最后 key 下标用 `(p \u0026 3) ^ e` 算出来。把这几个位置对齐，XXTEA 的循环就没那么绕了。\r\n\r\nPython 里推荐加满括号：\r\n\r\n```\r\nmx = (((z \u003e\u003e 5) ^ (y \u003c\u003c 2)) + ((y \u003e\u003e 3) ^ (z \u003c\u003c 4))) ^ ((s ^ y) + (k[(p \u0026 3) ^ e] ^ z))\r\n```\r\n\r\n### 5.4 加密流程\r\n\r\n```\r\nrounds = 6 + 52 // n\r\nsum = 0\r\nz = v[n - 1]\r\n\r\nrepeat rounds:\r\n    sum += delta\r\n    e = (sum \u003e\u003e 2) \u0026 3\r\n    for p = 0..n-2:\r\n        y = v[p + 1]\r\n        v[p] += MX\r\n        z = v[p]\r\n    y = v[0]\r\n    v[n - 1] += MX\r\n```\r\n\r\n### 5.5 解密流程\r\n\r\n```\r\nsum = rounds * delta\r\ny = v[0]\r\n\r\nwhile sum != 0:\r\n    e = (sum \u003e\u003e 2) \u0026 3\r\n    for p = n-1..1:\r\n        z = v[p - 1]\r\n        v[p] -= MX\r\n        y = v[p]\r\n    z = v[n - 1]\r\n    v[0] -= MX\r\n    sum -= delta\r\n```\r\n\r\n### 5.6 长度 word\r\n\r\nXXTEA 核心只处理 `uint32_t[]`。实际字节串封装常见两种：\r\n\r\n封装表现追加原始长度 word解密后最后 4 字节像明文长度只补零到 4 字节倍数解密后末尾可能有 `\\x00`\r\n\r\n如果解密结果主体正确、末尾奇怪，优先检查是否用了长度 word。\r\n\r\n## 6. 魔改排查表\r\n\r\n检查项标准常见魔改delta`0x9e3779b90x61c88647`、随机常量TEA/XTEA 轮数3216、64、自定义sum 初值0非零固定值字节序题目自定大端/小端混用key16 字节ASCII/hex/base64 混淆padding无标准PKCS#7、零填充、NoPaddingXXTEA 长度常追加长度 word裸 word 数组移位TEA `\u003c\u003c4 \u003e\u003e5`改移位数或改括号\r\n\r\n做题时可以按这个顺序走：先判断它到底是 TEA、XTEA 还是 XXTEA，再确认 key 是 ASCII 还是 hex 解码，接着看 endian、rounds、delta，最后再处理 padding 或长度 word。不要一上来就怀疑密钥错，很多时候只是大小端或轮数没对上。拿 `flag{`、文件头或者题目给的样例明密文做验证，效率会高很多。\r\n\r\n如果是 crackme 里拿 TEA 家族校验输入，动态调试也很好用。先找最终 `memcmp/strcmp` 或手写比较的位置，往前看一层，通常能看到程序把你的输入按 8 字节或 4 字节切开处理。这个时候记录输入 buffer、key buffer、加密后的结果，再回 Python 里复现。新手不要一开始就试图给每个临时变量起完美名字，先把输入输出对上。\r\n\r\n## 7. 代码实现：Python 离线工具脚本\r\n\r\n保存为 `tea_family_tool.py`。一个脚本同时支持 TEA、XTEA、XXTEA，但每个算法是独立函数，方便线下赛直接改魔改逻辑。\r\n\r\n```\r\n#!/usr/bin/env python3\r\nimport argparse\r\nimport struct\r\n\r\nMASK = 0xffffffff\r\nDELTA = 0x9e3779b9\r\n\r\n\r\ndef pad(data, bs):\r\n    n = bs - len(data) % bs\r\n    return data + bytes([n]) * n\r\n\r\n\r\ndef unpad(data, bs):\r\n    n = data[-1]\r\n    if n \u003c 1 or n \u003e bs or data[-n:] != bytes([n]) * n:\r\n        raise ValueError(\"bad padding\")\r\n    return data[:-n]\r\n\r\n\r\ndef tea_block(block, key, endian, rounds, dec=False):\r\n    v0, v1 = struct.unpack(endian + \"2I\", block)\r\n    k = struct.unpack(endian + \"4I\", key)\r\n    if not dec:\r\n        s = 0\r\n        for _ in range(rounds):\r\n            s = (s + DELTA) \u0026 MASK\r\n            v0 = (v0 + (((v1 \u003c\u003c 4) + k[0]) ^ (v1 + s) ^ ((v1 \u003e\u003e 5) + k[1]))) \u0026 MASK\r\n            v1 = (v1 + (((v0 \u003c\u003c 4) + k[2]) ^ (v0 + s) ^ ((v0 \u003e\u003e 5) + k[3]))) \u0026 MASK\r\n    else:\r\n        s = (DELTA * rounds) \u0026 MASK\r\n        for _ in range(rounds):\r\n            v1 = (v1 - (((v0 \u003c\u003c 4) + k[2]) ^ (v0 + s) ^ ((v0 \u003e\u003e 5) + k[3]))) \u0026 MASK\r\n            v0 = (v0 - (((v1 \u003c\u003c 4) + k[0]) ^ (v1 + s) ^ ((v1 \u003e\u003e 5) + k[1]))) \u0026 MASK\r\n            s = (s - DELTA) \u0026 MASK\r\n    return struct.pack(endian + \"2I\", v0, v1)\r\n\r\n\r\ndef xtea_block(block, key, endian, rounds, dec=False):\r\n    v0, v1 = struct.unpack(endian + \"2I\", block)\r\n    k = struct.unpack(endian + \"4I\", key)\r\n    if not dec:\r\n        s = 0\r\n        for _ in range(rounds):\r\n            v0 = (v0 + ((((v1 \u003c\u003c 4) ^ (v1 \u003e\u003e 5)) + v1) ^ (s + k[s \u0026 3]))) \u0026 MASK\r\n            s = (s + DELTA) \u0026 MASK\r\n            v1 = (v1 + ((((v0 \u003c\u003c 4) ^ (v0 \u003e\u003e 5)) + v0) ^ (s + k[(s \u003e\u003e 11) \u0026 3]))) \u0026 MASK\r\n    else:\r\n        s = (DELTA * rounds) \u0026 MASK\r\n        for _ in range(rounds):\r\n            v1 = (v1 - ((((v0 \u003c\u003c 4) ^ (v0 \u003e\u003e 5)) + v0) ^ (s + k[(s \u003e\u003e 11) \u0026 3]))) \u0026 MASK\r\n            s = (s - DELTA) \u0026 MASK\r\n            v0 = (v0 - ((((v1 \u003c\u003c 4) ^ (v1 \u003e\u003e 5)) + v1) ^ (s + k[s \u0026 3]))) \u0026 MASK\r\n    return struct.pack(endian + \"2I\", v0, v1)\r\n\r\n\r\ndef ecb(data, key, algo, dec, endian, rounds, use_pad):\r\n    if len(key) != 16:\r\n        raise ValueError(\"key must be 16 bytes\")\r\n    if not dec and use_pad:\r\n        data = pad(data, 8)\r\n    if len(data) % 8:\r\n        raise ValueError(\"TEA/XTEA data length must be multiple of 8\")\r\n    f = tea_block if algo == \"tea\" else xtea_block\r\n    out = b\"\".join(f(data[i:i + 8], key, endian, rounds, dec) for i in range(0, len(data), 8))\r\n    return unpad(out, 8) if dec and use_pad else out\r\n\r\n\r\ndef xx_to_words(data, include_len):\r\n    raw_len = len(data)\r\n    n = (raw_len + 3) // 4\r\n    data = data.ljust(n * 4, b\"\\0\")\r\n    words = list(struct.unpack(\"\u003c%dI\" % n, data)) if n else []\r\n    if include_len:\r\n        words.append(raw_len)\r\n    return words\r\n\r\n\r\ndef xx_to_bytes(words, include_len):\r\n    if include_len:\r\n        raw_len = words[-1]\r\n        words = words[:-1]\r\n    else:\r\n        raw_len = len(words) * 4\r\n    data = struct.pack(\"\u003c%dI\" % len(words), *[w \u0026 MASK for w in words])\r\n    if include_len:\r\n        if raw_len \u003c 0 or raw_len \u003e len(data):\r\n            raise ValueError(\"bad length word\")\r\n        return data[:raw_len]\r\n    return data\r\n\r\n\r\ndef xx_key(key):\r\n    return list(struct.unpack(\"\u003c4I\", key.ljust(16, b\"\\0\")[:16]))\r\n\r\n\r\ndef xx_encrypt_words(v, k):\r\n    n = len(v)\r\n    if n \u003c 2:\r\n        return v[:]\r\n    v = v[:]\r\n    rounds = 6 + 52 // n\r\n    s = 0\r\n    z = v[-1]\r\n    for _ in range(rounds):\r\n        s = (s + DELTA) \u0026 MASK\r\n        e = (s \u003e\u003e 2) \u0026 3\r\n        for p in range(n - 1):\r\n            y = v[p + 1]\r\n            mx = (((z \u003e\u003e 5) ^ (y \u003c\u003c 2)) + ((y \u003e\u003e 3) ^ (z \u003c\u003c 4))) ^ ((s ^ y) + (k[(p \u0026 3) ^ e] ^ z))\r\n            v[p] = (v[p] + mx) \u0026 MASK\r\n            z = v[p]\r\n        y = v[0]\r\n        p = n - 1\r\n        mx = (((z \u003e\u003e 5) ^ (y \u003c\u003c 2)) + ((y \u003e\u003e 3) ^ (z \u003c\u003c 4))) ^ ((s ^ y) + (k[(p \u0026 3) ^ e] ^ z))\r\n        v[p] = (v[p] + mx) \u0026 MASK\r\n        z = v[p]\r\n    return v\r\n\r\n\r\ndef xx_decrypt_words(v, k):\r\n    n = len(v)\r\n    if n \u003c 2:\r\n        return v[:]\r\n    v = v[:]\r\n    rounds = 6 + 52 // n\r\n    s = (rounds * DELTA) \u0026 MASK\r\n    y = v[0]\r\n    while s:\r\n        e = (s \u003e\u003e 2) \u0026 3\r\n        for p in range(n - 1, 0, -1):\r\n            z = v[p - 1]\r\n            mx = (((z \u003e\u003e 5) ^ (y \u003c\u003c 2)) + ((y \u003e\u003e 3) ^ (z \u003c\u003c 4))) ^ ((s ^ y) + (k[(p \u0026 3) ^ e] ^ z))\r\n            v[p] = (v[p] - mx) \u0026 MASK\r\n            y = v[p]\r\n        z = v[-1]\r\n        p = 0\r\n        mx = (((z \u003e\u003e 5) ^ (y \u003c\u003c 2)) + ((y \u003e\u003e 3) ^ (z \u003c\u003c 4))) ^ ((s ^ y) + (k[(p \u0026 3) ^ e] ^ z))\r\n        v[0] = (v[0] - mx) \u0026 MASK\r\n        y = v[0]\r\n        s = (s - DELTA) \u0026 MASK\r\n    return v\r\n\r\n\r\ndef xxtea(data, key, dec, use_len):\r\n    k = xx_key(key)\r\n    if dec:\r\n        if len(data) % 4:\r\n            raise ValueError(\"XXTEA ciphertext length must be multiple of 4\")\r\n        return xx_to_bytes(xx_decrypt_words(xx_to_words(data, False), k), use_len)\r\n    v = xx_to_words(data, use_len)\r\n    if len(v) \u003c 2:\r\n        v.append(0)\r\n    return xx_to_bytes(xx_encrypt_words(v, k), False)\r\n\r\n\r\ndef main():\r\n    ap = argparse.ArgumentParser(description=\"TEA/XTEA/XXTEA tool\")\r\n    ap.add_argument(\"data\", help=\"hex data\")\r\n    ap.add_argument(\"-a\", \"--algo\", choices=[\"tea\", \"xtea\", \"xxtea\"], required=True)\r\n    ap.add_argument(\"-k\", \"--key\", required=True, help=\"hex key by default\")\r\n    ap.add_argument(\"--key-raw\", action=\"store_true\")\r\n    ap.add_argument(\"-d\", \"--decrypt\", action=\"store_true\")\r\n    ap.add_argument(\"-r\", \"--rounds\", type=int, default=32)\r\n    ap.add_argument(\"--big\", action=\"store_true\")\r\n    ap.add_argument(\"--no-pad\", action=\"store_true\")\r\n    ap.add_argument(\"--xx-no-len\", action=\"store_true\")\r\n    args = ap.parse_args()\r\n\r\n    key = args.key.encode() if args.key_raw else bytes.fromhex(args.key)\r\n    data = bytes.fromhex(args.data)\r\n    if args.algo in (\"tea\", \"xtea\"):\r\n        out = ecb(data, key, args.algo, args.decrypt, \"\u003e\" if args.big else \"\u003c\", args.rounds, not args.no_pad)\r\n    else:\r\n        out = xxtea(data, key, args.decrypt, not args.xx_no_len)\r\n    print(out.hex())\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    main()\r\n```\r\n\r\n使用示例：\r\n\r\n```\r\npython tea_family_tool.py 666c61677b7465617d -a tea -k 30313233343536373839616263646566\r\npython tea_family_tool.py \u003ccipher_hex\u003e -a tea -k 30313233343536373839616263646566 -d\r\npython tea_family_tool.py \u003ccipher_hex\u003e -a xtea -k 30313233343536373839616263646566 -d -r 64\r\npython tea_family_tool.py \u003ccipher_hex\u003e -a xxtea -k 30313233343536373839616263646566 -d\r\n```\r\n\r\n## 8. 代码实现：C 语言核心速查\r\n\r\n### 8.1 TEA block\r\n\r\n```\r\n#include \u003cstdint.h\u003e\r\n#define DELTA 0x9e3779b9u\r\n\r\nvoid tea_encrypt(uint32_t v[2], const uint32_t k[4]) {\r\n    uint32_t v0 = v[0], v1 = v[1], sum = 0;\r\n    for (int i = 0; i \u003c 32; i++) {\r\n        sum += DELTA;\r\n        v0 += ((v1 \u003c\u003c 4) + k[0]) ^ (v1 + sum) ^ ((v1 \u003e\u003e 5) + k[1]);\r\n        v1 += ((v0 \u003c\u003c 4) + k[2]) ^ (v0 + sum) ^ ((v0 \u003e\u003e 5) + k[3]);\r\n    }\r\n    v[0] = v0; v[1] = v1;\r\n}\r\n\r\nvoid tea_decrypt(uint32_t v[2], const uint32_t k[4]) {\r\n    uint32_t v0 = v[0], v1 = v[1], sum = DELTA * 32u;\r\n    for (int i = 0; i \u003c 32; i++) {\r\n        v1 -= ((v0 \u003c\u003c 4) + k[2]) ^ (v0 + sum) ^ ((v0 \u003e\u003e 5) + k[3]);\r\n        v0 -= ((v1 \u003c\u003c 4) + k[0]) ^ (v1 + sum) ^ ((v1 \u003e\u003e 5) + k[1]);\r\n        sum -= DELTA;\r\n    }\r\n    v[0] = v0; v[1] = v1;\r\n}\r\n```\r\n\r\n### 8.2 XTEA block\r\n\r\n```\r\nvoid xtea_encrypt(uint32_t v[2], const uint32_t k[4], unsigned rounds) {\r\n    uint32_t v0 = v[0], v1 = v[1], sum = 0;\r\n    for (unsigned i = 0; i \u003c rounds; i++) {\r\n        v0 += ((((v1 \u003c\u003c 4) ^ (v1 \u003e\u003e 5)) + v1) ^ (sum + k[sum \u0026 3]));\r\n        sum += DELTA;\r\n        v1 += ((((v0 \u003c\u003c 4) ^ (v0 \u003e\u003e 5)) + v0) ^ (sum + k[(sum \u003e\u003e 11) \u0026 3]));\r\n    }\r\n    v[0] = v0; v[1] = v1;\r\n}\r\n\r\nvoid xtea_decrypt(uint32_t v[2], const uint32_t k[4], unsigned rounds) {\r\n    uint32_t v0 = v[0], v1 = v[1], sum = DELTA * rounds;\r\n    for (unsigned i = 0; i \u003c rounds; i++) {\r\n        v1 -= ((((v0 \u003c\u003c 4) ^ (v0 \u003e\u003e 5)) + v0) ^ (sum + k[(sum \u003e\u003e 11) \u0026 3]));\r\n        sum -= DELTA;\r\n        v0 -= ((((v1 \u003c\u003c 4) ^ (v1 \u003e\u003e 5)) + v1) ^ (sum + k[sum \u0026 3]));\r\n    }\r\n    v[0] = v0; v[1] = v1;\r\n}\r\n```\r\n\r\n### 8.3 XXTEA word array\r\n\r\n```\r\n#define MX (((z \u003e\u003e 5 ^ y \u003c\u003c 2) + (y \u003e\u003e 3 ^ z \u003c\u003c 4)) ^ ((sum ^ y) + (key[(p \u0026 3) ^ e] ^ z)))\r\n\r\nvoid xxtea_encrypt(uint32_t *v, int n, const uint32_t key[4]) {\r\n    if (n \u003c 2) return;\r\n    uint32_t y, z = v[n - 1], sum = 0, e;\r\n    unsigned rounds = 6 + 52 / (unsigned)n;\r\n    while (rounds--) {\r\n        sum += DELTA;\r\n        e = (sum \u003e\u003e 2) \u0026 3;\r\n        for (int p = 0; p \u003c n - 1; p++) {\r\n            y = v[p + 1];\r\n            v[p] += MX;\r\n            z = v[p];\r\n        }\r\n        int p = n - 1;\r\n        y = v[0];\r\n        v[p] += MX;\r\n        z = v[p];\r\n    }\r\n}\r\n```\r\n\r\n## 9. 魔改与做题套路\r\n\r\n快速分类可以这么记：\r\n\r\n```\r\n0x9e3779b9 + 固定 k0/k1/k2/k3       -\u003e TEA\r\n0x9e3779b9 + sum\u00263 + sum\u003e\u003e11\u00263     -\u003e XTEA\r\n0x9e3779b9 + 6+52/n + MX/z/y/e/p   -\u003e XXTEA\r\n```\r\n\r\n真正卡人的通常不是公式本身，而是实现细节。Python 忘记 `\u0026 0xffffffff`、大小端用错、把 hex 文本当 ASCII、TEA/XTEA 轮数口径没对上、XXTEA 忘记长度 word，这些都很常见。还有一个坑是把 XXTEA 当成 8 字节 ECB 去切，结果当然越解越怪，因为它本来处理的是整个 word 数组"])</script><script>self.__next_f.push([1,"1d:T3833,"])</script><script>self.__next_f.push([1,"\r\n# SM4 算法整理\r\n\r\nSM4 是国密体系里的对称分组算法，分组长度和密钥长度都是 128 bit。CTF 里它经常和 SM2、SM3 一起出现，场景也比较杂，可能是流量包，也可能是 Java/Python 业务代码、安卓逆向、接口加密。看到 `SM2/SM3/SM4` 这几个字样时，可以先把国密这条线拉出来。\r\n\r\nkey 那边会扩展出 32 个轮密钥；数据那边把 16 字节明文拆成 `X0..X3`，做 32 轮迭代，最后按 `X35 X34 X33 X32` 反序输出。解密不用另写一套结构，只要把轮密钥倒过来用。\r\n\r\n## 实战识别\r\n\r\nSM4 在逆向里比 AES 还好认一点，因为国密实现经常把常量表老老实实放在二进制里。先搜 `A3 B1 BA C6`，这是 FK 的开头；再搜 S 盒开头 `D6 90 E9 FE CC E1 3D B7`。如果这两组都能找到，旁边又有 32 轮循环，基本就可以确认是 SM4。\r\n\r\n如果是 Java、Android 或前端相关题，也可以先看字符串。`SM4/ECB/PKCS5Padding`、`SM4/CBC/PKCS7Padding`、`CryptSM4`、`sm4.encrypt` 这类名字一出来，算法就不用猜了。新手真正要花时间的是 key/iv 编码：它可能是 16 字节 ASCII，也可能是一串 hex 解码后的 16 字节，还可能先 base64 再 hex。看见 `Hex.decode()`、`bytes.fromhex()`、`Base64.decode()`，先把数据流捋清楚。\r\n\r\n我觉得 SM4 题最适合按“先认常量，再追参数”的路线做。FK、CK、S 盒能说明这是 SM4，但 flag 能不能出来，还是看你有没有把 key、iv、模式和 padding 还原对。\r\n\r\n## 1. 参数速查\r\n\r\n项目内容类型对称分组密码分组长度128 bit，16 字节密钥长度128 bit，16 字节轮数32 轮结构非平衡 Feistel-like 结构基本操作XOR、循环左移、S 盒、线性变换常见模式ECB、CBC、CTR、GCM 类似封装，实际看库支持CTF 特征`FK`、`CK` 常量表，32 轮，`0xd6 0x90 0xe9 0xfe` 开头的 S 盒\r\n\r\nSM4 的核心：\r\n\r\n```\r\n128 bit 明文 -\u003e X0 X1 X2 X3，每个 32 bit\r\n32 轮迭代:\r\n    X(i+4) = X(i) XOR T(X(i+1) XOR X(i+2) XOR X(i+3) XOR rk(i))\r\n输出:\r\n    X35 X34 X33 X32\r\n```\r\n\r\n注意最后输出是反序。\r\n\r\n## 2. 算法详解\r\n\r\n### 2.1 轮函数\r\n\r\n一轮更新：\r\n\r\n```\r\nX(i+4) = X(i) XOR T(X(i+1) XOR X(i+2) XOR X(i+3) XOR rk(i))\r\n```\r\n\r\n这里的 `T` 不是一个单独查表，而是“过 S 盒 + 线性扩散”的合成变换：\r\n\r\n```\r\nT(A) = L(tau(A))\r\n```\r\n\r\n`tau` 负责非线性，把 32 bit 拆成 4 个字节后逐个过 S 盒；`L` 负责扩散，用几次循环左移再 XOR 回来。看代码时如果先过 S 盒、再出现 `\u003c\u003c\u003c 2/10/18/24`，基本就是 SM4 的加密轮函数。\r\n\r\n### 2.2 加密线性变换 L\r\n\r\n```\r\nL(B) = B XOR (B \u003c\u003c\u003c 2) XOR (B \u003c\u003c\u003c 10) XOR (B \u003c\u003c\u003c 18) XOR (B \u003c\u003c\u003c 24)\r\n```\r\n\r\n这里 `\u003c\u003c\u003c` 表示 32 bit 循环左移。\r\n\r\n### 2.3 密钥扩展\r\n\r\nSM4 主密钥为 128 bit，拆成：\r\n\r\n```\r\nMK0 MK1 MK2 MK3\r\n```\r\n\r\n先与系统参数 `FK` 异或：\r\n\r\n```\r\nK0 = MK0 XOR FK0\r\nK1 = MK1 XOR FK1\r\nK2 = MK2 XOR FK2\r\nK3 = MK3 XOR FK3\r\n```\r\n\r\n再生成 32 个轮密钥：\r\n\r\n```\r\nrk(i) = K(i+4) = K(i) XOR T'(K(i+1) XOR K(i+2) XOR K(i+3) XOR CK(i))\r\n```\r\n\r\n密钥扩展使用的 `T'` 和加密的 `T` 类似，但线性变换不同：\r\n\r\n```\r\nL'(B) = B XOR (B \u003c\u003c\u003c 13) XOR (B \u003c\u003c\u003c 23)\r\n```\r\n\r\n### 2.4 解密\r\n\r\nSM4 解密不用写另一套算法，只需要把轮密钥倒序使用：\r\n\r\n```\r\n加密: rk0, rk1, ..., rk31\r\n解密: rk31, rk30, ..., rk0\r\n```\r\n\r\n这点和 DES 的 Feistel 解密思路类似。\r\n\r\n## 3. 工作模式与 padding\r\n\r\nSM4 核心只处理 16 字节分组。ECB/CBC 下需要 padding，常见是 PKCS#7：\r\n\r\n```\r\n明文长度刚好 16 的倍数时，也要额外补一整块 0x10\r\n```\r\n\r\n模式这块和 AES 的直觉差不多。ECB 简单但会泄露重复块；CBC 需要 16 字节 IV，业务系统里很常见；CTR 不需要 padding，但 nonce/counter 不能复用；GCM 带认证能力，不过实际库支持没有 AES-GCM 那么普遍。\r\n\r\n国密题里还要注意编码：很多业务代码会把 key/iv 写成 hex 字符串。例如 `\"313233...\"` 到底是 ASCII 字符串，还是 hex 解码后的字节，必须看代码。\r\n\r\n## 4. 代码实现：Python 调用\r\n\r\n### 4.1 gmssl 调用 SM4\r\n\r\n安装：\r\n\r\n```\r\npip install gmssl\r\n```\r\n\r\nECB 示例：\r\n\r\n```\r\nfrom gmssl.sm4 import CryptSM4, SM4_ENCRYPT, SM4_DECRYPT\r\n\r\nkey = b\"0123456789abcdef\"\r\npt = b\"flag{sm4_demo}\"\r\n\r\ncrypt = CryptSM4()\r\ncrypt.set_key(key, SM4_ENCRYPT)\r\nct = crypt.crypt_ecb(pt)  # gmssl 会按它的实现做填充\r\n\r\ncrypt.set_key(key, SM4_DECRYPT)\r\nrecovered = crypt.crypt_ecb(ct)\r\nassert recovered == pt\r\n\r\nprint(ct.hex())\r\n```\r\n\r\nCBC 示例：\r\n\r\n```\r\nfrom gmssl.sm4 import CryptSM4, SM4_ENCRYPT, SM4_DECRYPT\r\n\r\nkey = b\"0123456789abcdef\"\r\niv = b\"1234567890abcdef\"\r\npt = b\"flag{sm4_cbc_demo}\"\r\n\r\ncrypt = CryptSM4()\r\ncrypt.set_key(key, SM4_ENCRYPT)\r\nct = crypt.crypt_cbc(iv, pt)\r\n\r\ncrypt.set_key(key, SM4_DECRYPT)\r\nrecovered = crypt.crypt_cbc(iv, ct)\r\nassert recovered == pt\r\n```\r\n\r\ngmssl 的封装比较适合快速解题，但不同版本对 padding 的细节要以本地实际为准。若题目给的是“裸 SM4 单块”，建议使用 OpenSSL 或自己实现 block 函数。\r\n\r\n### 4.2 PyCryptodome 提醒\r\n\r\nPyCryptodome 主文档里常用的是 AES/DES/ARC4 等算法；SM4 支持情况要看本地版本。如果比赛环境没有 SM4，优先准备 `gmssl` 或 OpenSSL 命令行。\r\n\r\n## 5. 代码实现：C 语言 OpenSSL EVP 调用\r\n\r\nOpenSSL 1.1.1 以后通常提供 SM4，例如 `EVP_sm4_cbc()`、`EVP_sm4_ecb()`、`EVP_sm4_ctr()`。下面是 CBC 示例。\r\n\r\n```\r\n#include \u003copenssl/evp.h\u003e\r\n#include \u003cstdio.h\u003e\r\n#include \u003cstring.h\u003e\r\n\r\nint sm4_cbc_encrypt(const unsigned char *key, const unsigned char *iv,\r\n                    const unsigned char *pt, int pt_len,\r\n                    unsigned char *ct, int *ct_len) {\r\n    EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();\r\n    int len = 0, total = 0;\r\n    if (!ctx) return 0;\r\n    if (EVP_EncryptInit_ex(ctx, EVP_sm4_cbc(), NULL, key, iv) != 1) return 0;\r\n    if (EVP_EncryptUpdate(ctx, ct, \u0026len, pt, pt_len) != 1) return 0;\r\n    total += len;\r\n    if (EVP_EncryptFinal_ex(ctx, ct + total, \u0026len) != 1) return 0;\r\n    total += len;\r\n    *ct_len = total;\r\n    EVP_CIPHER_CTX_free(ctx);\r\n    return 1;\r\n}\r\n\r\nint sm4_cbc_decrypt(const unsigned char *key, const unsigned char *iv,\r\n                    const unsigned char *ct, int ct_len,\r\n                    unsigned char *pt, int *pt_len) {\r\n    EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();\r\n    int len = 0, total = 0;\r\n    if (!ctx) return 0;\r\n    if (EVP_DecryptInit_ex(ctx, EVP_sm4_cbc(), NULL, key, iv) != 1) return 0;\r\n    if (EVP_DecryptUpdate(ctx, pt, \u0026len, ct, ct_len) != 1) return 0;\r\n    total += len;\r\n    if (EVP_DecryptFinal_ex(ctx, pt + total, \u0026len) != 1) return 0;\r\n    total += len;\r\n    *pt_len = total;\r\n    EVP_CIPHER_CTX_free(ctx);\r\n    return 1;\r\n}\r\n\r\nint main(void) {\r\n    const unsigned char key[16] = \"0123456789abcdef\";\r\n    const unsigned char iv[16] = \"1234567890abcdef\";\r\n    const unsigned char msg[] = \"flag{sm4_c_demo}\";\r\n    unsigned char ct[128], pt[128];\r\n    int ct_len = 0, pt_len = 0;\r\n\r\n    if (!sm4_cbc_encrypt(key, iv, msg, (int)strlen((const char *)msg), ct, \u0026ct_len)) {\r\n        puts(\"encrypt failed\");\r\n        return 1;\r\n    }\r\n    if (!sm4_cbc_decrypt(key, iv, ct, ct_len, pt, \u0026pt_len)) {\r\n        puts(\"decrypt failed\");\r\n        return 1;\r\n    }\r\n    pt[pt_len] = 0;\r\n\r\n    printf(\"cipher hex: \");\r\n    for (int i = 0; i \u003c ct_len; i++) printf(\"%02x\", ct[i]);\r\n    printf(\"\\nplain: %s\\n\", pt);\r\n    return 0;\r\n}\r\n```\r\n\r\n编译：\r\n\r\n```\r\ngcc sm4_evp_demo.c -o sm4_evp_demo -lcrypto\r\n```\r\n\r\n如果编译时报 `EVP_sm4_cbc` 未声明，说明 OpenSSL 头文件版本太旧，换新版本或改用 GmSSL / Tongsuo。\r\n\r\n## 6. 例题里一般怎么用它\r\n\r\n### 6.1 国密组合\r\n\r\n业务题里很常见的一套组合是：\r\n\r\n```\r\nSM2 加密会话密钥\r\nSM3 做摘要\r\nSM4-CBC 加密数据\r\n```\r\n\r\n如果手里只有 SM4 密文，第一步不是硬解，而是找 key 和 IV 从哪来；如果题里还给了 SM2 私钥、接口泄露或者日志，通常就是先恢复会话密钥，再拿 SM4 解业务数据。\r\n\r\n### 6.2 key/iv 编码混淆\r\n\r\nkey/iv 的编码是 SM4 题里最容易翻车的地方。下面这两种写法看起来都像“313233”，实际完全不是一回事：\r\n\r\n```\r\nkey = b\"3132333435363738\"          # 16 字节 ASCII 的一部分\r\nkey = bytes.fromhex(\"31323334...\") # hex 解码后才是真 key\r\n```\r\n\r\n看到 Java 里的 `Hex.decode()`、Python 里的 `bytes.fromhex()`、JS 里的 `CryptoJS.enc.Hex.parse()` 要格外注意。很多题不是你 SM4 写错了，而是 key 字节一开始就拿错了。\r\n\r\n### 6.3 CBC bit flipping 和 padding oracle\r\n\r\nSM4-CBC 的攻击面和 AES-CBC 是一套逻辑。算法换成国密不会自动防篡改，如果程序只加密、不校验密文有没有被改过，IV bit flipping、中间块 bit flipping、padding 报错泄露、固定 IV 泄露首块这些问题照样会出现。做题时不要被“SM4”这个名字吓住，CBC 还是那个 CBC。\r\n\r\n### 6.4 逆向识别\r\n\r\n逆向识别 SM4，最舒服的办法是搜常量。`FK = a3b1bac6 56aa3350 677d9197 b27022dc` 很醒目，`CK` 有 32 个 word，S 盒开头也常见 `d6 90 e9 fe cc e1 3d b7 ...`。如果再看到 32 轮和解密时 reverse round key，基本就不用猜了。\r\n\r\n## 7. 更完整的 SM4 细节\r\n\r\n### 7.1 常量表识别\r\n\r\nSM4 逆向里最容易识别的是三类常量。\r\n\r\n系统参数 FK：\r\n\r\n```\r\nA3B1BAC6 56AA3350 677D9197 B27022DC\r\n```\r\n\r\n固定参数 CK 一共 32 个 word，开头通常是：\r\n\r\n```\r\n00070E15 1C232A31 383F464D 545B6269\r\n70777E85 8C939AA1 A8AFB6BD C4CBD2D9\r\n```\r\n\r\nS 盒开头常见：\r\n\r\n```\r\nD6 90 E9 FE CC E1 3D B7 16 B6 14 C2 28 FB 2C 05\r\n```\r\n\r\n只要二进制里搜到这些常量，基本可以确认 SM4。\r\n\r\n### 7.2 字节序\r\n\r\nSM4 标准描述通常按大端把 16 字节分成 4 个 32 bit word：\r\n\r\n```\r\nX0 = bytes[0..3]\r\nX1 = bytes[4..7]\r\nX2 = bytes[8..11]\r\nX3 = bytes[12..15]\r\n```\r\n\r\n也就是：\r\n\r\n```\r\nint.from_bytes(block[0:4], \"big\")\r\n```\r\n\r\n但很多 C 实现为了效率会用宏读写，如果宏写错或平台相关，可能出现大小端差异。逆向时要跟着实现走，不要只跟标准文字走。\r\n\r\n### 7.3 ECB/CBC 的 padding 差异\r\n\r\nPython `gmssl` 的 `CryptSM4().crypt_ecb()`、`crypt_cbc()` 通常会处理 PKCS#7 风格 padding。但如果题目用的是 OpenSSL、Java BouncyCastle、前端 sm-crypto，不同库的参数可能写成：\r\n\r\n```\r\nSM4/ECB/PKCS5Padding\r\nSM4/CBC/PKCS7Padding\r\nSM4/CBC/NoPadding\r\n```\r\n\r\n其中 `PKCS5Padding` 在 16 字节分组算法里很多库实际按 PKCS#7 处理。遇到 NoPadding 时，明文长度必须已经是 16 的倍数。\r\n\r\n## 8. 国密题排查清单\r\n\r\n1. 先看 key/iv 是 ASCII、hex 还是 base64。\r\n2. 确认模式：ECB/CBC/CTR/GCM。\r\n3. 确认 padding：PKCS#7、NoPadding、零填充。\r\n4. 若是 CBC，确认 IV 是否固定、是否和密文拼在一起。\r\n5. 若是 Web/Java 题，查 `SM4Utils`、`Cipher.getInstance()`、`Hex.decode()`、`Base64.decode()`。\r\n6. 若是逆向题，搜 FK/CK/Sbox 常量。\r\n7. 如果能解出部分明文但末尾错，先调 padding；如果全部乱码，再查 key 编码和大小端。\r\n\r\n安卓或 Java 题里可以优先从调用链下手。比如 `Cipher.getInstance(\"SM4/CBC/PKCS5Padding\")`、`setKey`、`crypt_cbc` 这些位置，往上追参数通常比硬啃 32 轮 SM4 轻松。native so 里如果是自实现，就搜 FK/S 盒常量；如果是调用 GmSSL、OpenSSL、Tongsuo 之类库，就先看导入和字符串。逆向的目标不是证明自己能手推 SM4，而是把它实际用的 key、iv、mode 和 padding 还原出来。\r\n\r\n### 8.1 Python/Java/JS 编码坑\r\n\r\n同一个字符串可能代表三种不同 key：\r\n\r\n```\r\n\"0123456789abcdef\"                       # 16 字节 ASCII key\r\n\"30313233343536373839616263646566\"       # 32 字符 hex 文本\r\nbytes.fromhex(\"303132...\")               # 解码后又变回 ASCII key\r\n```\r\n\r\n前端 CryptoJS/sm-crypto 常见：\r\n\r\n```\r\nkey = \"0123456789abcdeffedcba9876543210\"\r\n```\r\n\r\n这可能是 16 字节 hex key，也可能被当作 32 字节文本，取决于库 API。做题时必须看调用方式。\r\n\r\n## 9. 代码实现：本篇离线脚本\r\n\r\n下面保存为 `sm4_tool.py`。依赖 `gmssl`，支持 ECB/CBC，默认使用 gmssl 自带 padding。若需要 NoPadding，可以加 `--no-pad`，脚本会直接调用底层单块函数较麻烦；比赛中更常见做法是确保输入已经按库预期处理。这里保留 gmssl 高层接口，稳定优先。\r\n\r\n```\r\n#!/usr/bin/env python3\r\nimport argparse\r\nfrom gmssl.sm4 import CryptSM4, SM4_DECRYPT, SM4_ENCRYPT\r\n\r\n\r\ndef parse_key(s: str, raw: bool) -\u003e bytes:\r\n    return s.encode() if raw else bytes.fromhex(s)\r\n\r\n\r\ndef main() -\u003e None:\r\n    ap = argparse.ArgumentParser(description=\"SM4 ECB/CBC gmssl tool\")\r\n    ap.add_argument(\"data\", help=\"hex data\")\r\n    ap.add_argument(\"-k\", \"--key\", required=True, help=\"hex key by default\")\r\n    ap.add_argument(\"--key-raw\", action=\"store_true\", help=\"treat key as raw string\")\r\n    ap.add_argument(\"--iv\", help=\"hex IV for CBC\")\r\n    ap.add_argument(\"--iv-raw\", action=\"store_true\")\r\n    ap.add_argument(\"-m\", \"--mode\", choices=[\"ecb\", \"cbc\"], default=\"cbc\")\r\n    ap.add_argument(\"-d\", \"--decrypt\", action=\"store_true\")\r\n    args = ap.parse_args()\r\n\r\n    key = parse_key(args.key, args.key_raw)\r\n    if len(key) != 16:\r\n        raise ValueError(\"SM4 key must be 16 bytes\")\r\n\r\n    data = bytes.fromhex(args.data)\r\n    crypt = CryptSM4()\r\n    crypt.set_key(key, SM4_DECRYPT if args.decrypt else SM4_ENCRYPT)\r\n\r\n    if args.mode == \"ecb\":\r\n        out = crypt.crypt_ecb(data)\r\n    else:\r\n        if args.iv is None:\r\n            raise ValueError(\"CBC needs --iv\")\r\n        iv = parse_key(args.iv, args.iv_raw)\r\n        if len(iv) != 16:\r\n            raise ValueError(\"SM4 IV must be 16 bytes\")\r\n        out = crypt.crypt_cbc(iv, data)\r\n    print(out.hex())\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    main()\r\n```\r\n\r\n示例：\r\n\r\n```\r\npython sm4_tool.py 666c61677b736d347d -k 30313233343536373839616263646566 --iv 31323334353637383930616263646566\r\npython sm4_tool.py \u003ccipher_hex\u003e -k 30313233343536373839616263646566 --iv 31323334353637383930616263646566 -d\r\npython sm4_tool.py \u003ccipher_hex\u003e -k 0123456789abcdef --key-raw --iv 1234567890abcdef --iv-raw -d\r\n```"])</script><script>self.__next_f.push([1,"1e:T3673,"])</script><script>self.__next_f.push([1,"\r\n# RC4 / ARC4 算法整理\r\n\r\n\u003e RC4 在题里经常也会写成 ARC4，名字不一样，做题时基本按同一个东西看就行。它属于那种“原理不长，但很适合出逆向题”的算法：一个 256 字节的状态数组，被 key 打乱以后不断生成密钥流，最后和数据异或得到密文。\r\n\r\nRC4 不是直接拿 key 去异或明文，而是先用 key 把 `S[256]` 这张表洗一遍，后面再从这张表里持续生成密钥流。最后一步才是异或。因为异或本身可逆，所以同一套流程既能加密也能解密。\r\n\r\n## 实战识别\r\n\r\n新手看 RC4 不用先背 KSA、PRGA 这两个名字，先在反编译结果里找“256”。RC4 基本会有一个 256 字节数组，先被填成 `0,1,2,...,255`，然后进入 256 次交换。这个形状在 IDA/Ghidra 里很显眼，通常能看到类似 `for (i = 0; i \u003c 256; i++) s[i] = i;` 的初始化，后面紧跟着 `j = j + s[i] + key[...]` 和交换 `s[i] / s[j]`。\r\n\r\n认出来以后再看 key 从哪来。逆向里的 key 可能是硬编码字符串，也可能从用户输入、资源段、配置文件里拿出来；有些程序还会先对 key 做 MD5/SHA1，或者拼一个 salt。这里不要嫌麻烦，程序怎么处理 key，脚本里就要怎么处理。RC4 没有 block size，所以不用去找 padding，也不用纠结 ECB/CBC。真正要对齐的是 key、是否 drop 了前几字节密钥流，以及输入输出到底是 raw bytes、hex 还是 base64。\r\n\r\n做题时我一般按这个顺序来：先确认有没有 `S[256]`，再确认有没有 KSA 和 PRGA 两段循环，然后找 key，最后拿密文跑脚本。只要密钥流对上，RC4 的解密不会再有别的花活。\r\n\r\n## 1. 参数速查\r\n\r\n项目内容类型对称流密码分组长度无固定分组，按字节产生密钥流常见密钥长度1~256 字节；\r\n\r\nPyCryptodome 文档给出的范围是 8~2048 bitIV / nonce原始 RC4 没有内置 IV核心结构256 字节状态数组 `S`，先 KSA 初始化，再 PRGA 输出密钥流安全状态已不推荐用于真实安全场景；CTF 中常见于老协议、弱加密、逆向题\r\n\r\nRC4 胜在短，几十行就能写完，逆向时也很显眼。它不是分组密码，所以别往 ECB、CBC、PKCS#7 那套上硬靠；它干的事就是生成一串和明文等长的密钥流，然后 XOR：\r\n\r\n```\r\nciphertext = plaintext XOR keystream\r\nplaintext  = ciphertext XOR keystream\r\n```\r\n\r\n## 2. 算法详解\r\n\r\nRC4 分成两个阶段。前半段是 KSA，也就是 Key Scheduling Algorithm，用 key 把初始的 `S[0..255]` 打乱；后半段是 PRGA，也就是 Pseudo-Random Generation Algorithm，从这个被打乱的状态里持续生成密钥流。\r\n\r\n### 2.1 KSA：用密钥打乱 S 盒\r\n\r\n初始状态：\r\n\r\n```\r\nS = [0, 1, 2, ..., 255]\r\nj = 0\r\n```\r\n\r\n对 `i = 0..255`：\r\n\r\n```\r\nj = (j + S[i] + key[i mod key_len]) mod 256\r\nswap(S[i], S[j])\r\n```\r\n\r\nKSA 的本质是：把密钥字节循环参与到 256 次交换里，得到一个依赖密钥的置换表 `S`。\r\n\r\n这里最该记住的是“同一个 key 会洗出同一个 S”。原始 RC4 自己没有 nonce，所以同一个 key 拿去加密两段不同明文，就会重复同一段密钥流，后面自然变成 `C1 XOR C2 = P1 XOR P2`。有些协议会把 `nonce || long_term_key` 或 HMAC 派生结果再当 RC4 key，用协议层补一下，但这不是 RC4 自带的设计。\r\n\r\n### 2.2 PRGA：持续输出密钥流\r\n\r\nKSA 后设置：\r\n\r\n```\r\ni = 0\r\nj = 0\r\n```\r\n\r\n每输出 1 字节：\r\n\r\n```\r\ni = (i + 1) mod 256\r\nj = (j + S[i]) mod 256\r\nswap(S[i], S[j])\r\nt = (S[i] + S[j]) mod 256\r\nK = S[t]\r\n```\r\n\r\n得到的 `K` 就是密钥流字节，明文字节与它 XOR 得到密文字节。\r\n\r\n### 2.3 手算一轮时抓住三个变量\r\n\r\nRC4 题里很常见的一种套路，是不给你名字，只给一段 KSA/PRGA 的代码。这个时候不用慌，先找有没有长度 256 的数组，是否初始化成 `0..255`，循环里是不是大量 `% 256` 或 `\u0026 0xff`。如果后面还出现 `i += 1`、`j += S[i]`、交换 `S[i]` 和 `S[j]`，再输出 `S[(S[i] + S[j]) \u0026 0xff]`，基本就能往 RC4 上靠了。\r\n\r\n## 3. 代码实现与库调用\r\n\r\n### 3.1 PyCryptodome 调用 ARC4\r\n\r\n安装：\r\n\r\n```\r\npip install pycryptodome\r\n```\r\n\r\n示例：\r\n\r\n```\r\nfrom Crypto.Cipher import ARC4\r\nfrom binascii import hexlify\r\n\r\nkey = b\"this_is_a_rc4_key\"\r\ndata = b\"flag{rc4_demo}\"\r\n\r\ncipher = ARC4.new(key)\r\nct = cipher.encrypt(data)\r\n\r\ndecipher = ARC4.new(key)\r\npt = decipher.decrypt(ct)\r\n\r\nprint(hexlify(ct).decode())\r\nprint(pt)\r\n```\r\n\r\nRC4 是流密码，`encrypt()` 和 `decrypt()` 本质相同；但对象内部有状态，不能拿已经加密过数据的同一个对象从头解密。要重新 new 一个对象，保证密钥流从第 0 字节开始。\r\n\r\n### 3.2 丢弃前 N 字节密钥流\r\n\r\nRC4 早期输出有偏差。部分资料会使用 RC4-dropN，例如丢弃前 768 或 3072 字节。PyCryptodome 的 ARC4 支持 `drop` 参数：\r\n\r\n```\r\nfrom Crypto.Cipher import ARC4\r\n\r\nkey = b\"secret\"\r\ndata = b\"message\"\r\n\r\ncipher = ARC4.new(key, drop=3072)\r\nct = cipher.encrypt(data)\r\n\r\ndecipher = ARC4.new(key, drop=3072)\r\npt = decipher.decrypt(ct)\r\nassert pt == data\r\n```\r\n\r\nCTF 中如果你发现官方脚本加密前调用了一段空加密，例如 `rc4.encrypt(b\"\\x00\" * 1024)` 但没有保存结果，本质就是在 drop。\r\n\r\n### 3.3 纯 Python 实现，适合断网环境\r\n\r\n```\r\ndef rc4_crypt(data: bytes, key: bytes, drop: int = 0) -\u003e bytes:\r\n    if not key:\r\n        raise ValueError(\"RC4 key must not be empty\")\r\n\r\n    s = list(range(256))\r\n    j = 0\r\n    for i in range(256):\r\n        j = (j + s[i] + key[i % len(key)]) \u0026 0xff\r\n        s[i], s[j] = s[j], s[i]\r\n\r\n    i = j = 0\r\n    out = bytearray()\r\n\r\n    def next_byte() -\u003e int:\r\n        nonlocal i, j\r\n        i = (i + 1) \u0026 0xff\r\n        j = (j + s[i]) \u0026 0xff\r\n        s[i], s[j] = s[j], s[i]\r\n        return s[(s[i] + s[j]) \u0026 0xff]\r\n\r\n    for _ in range(drop):\r\n        next_byte()\r\n\r\n    for b in data:\r\n        out.append(b ^ next_byte())\r\n    return bytes(out)\r\n\r\n\r\nkey = b\"Wiki\"\r\npt = b\"pedia\"\r\nct = rc4_crypt(pt, key)\r\nassert rc4_crypt(ct, key) == pt\r\nprint(ct.hex())\r\n```\r\n\r\n## 4. C 语言全流程实现\r\n\r\n下面代码从 KSA、PRGA 到加解密完整实现。加密和解密调用同一个 `rc4_crypt`。\r\n\r\n```\r\n#include \u003cstdint.h\u003e\r\n#include \u003cstdio.h\u003e\r\n#include \u003cstdlib.h\u003e\r\n#include \u003cstring.h\u003e\r\n\r\ntypedef struct {\r\n    uint8_t s[256];\r\n    uint8_t i;\r\n    uint8_t j;\r\n} RC4_CTX;\r\n\r\nvoid rc4_init(RC4_CTX *ctx, const uint8_t *key, size_t key_len) {\r\n    uint8_t j = 0;\r\n    for (int i = 0; i \u003c 256; i++) {\r\n        ctx-\u003es[i] = (uint8_t)i;\r\n    }\r\n    for (int i = 0; i \u003c 256; i++) {\r\n        j = (uint8_t)(j + ctx-\u003es[i] + key[i % key_len]);\r\n        uint8_t tmp = ctx-\u003es[i];\r\n        ctx-\u003es[i] = ctx-\u003es[j];\r\n        ctx-\u003es[j] = tmp;\r\n    }\r\n    ctx-\u003ei = 0;\r\n    ctx-\u003ej = 0;\r\n}\r\n\r\nuint8_t rc4_next(RC4_CTX *ctx) {\r\n    ctx-\u003ei = (uint8_t)(ctx-\u003ei + 1);\r\n    ctx-\u003ej = (uint8_t)(ctx-\u003ej + ctx-\u003es[ctx-\u003ei]);\r\n    uint8_t tmp = ctx-\u003es[ctx-\u003ei];\r\n    ctx-\u003es[ctx-\u003ei] = ctx-\u003es[ctx-\u003ej];\r\n    ctx-\u003es[ctx-\u003ej] = tmp;\r\n    return ctx-\u003es[(uint8_t)(ctx-\u003es[ctx-\u003ei] + ctx-\u003es[ctx-\u003ej])];\r\n}\r\n\r\nvoid rc4_crypt(uint8_t *out, const uint8_t *in, size_t len,\r\n               const uint8_t *key, size_t key_len, size_t drop) {\r\n    RC4_CTX ctx;\r\n    rc4_init(\u0026ctx, key, key_len);\r\n    for (size_t k = 0; k \u003c drop; k++) {\r\n        (void)rc4_next(\u0026ctx);\r\n    }\r\n    for (size_t k = 0; k \u003c len; k++) {\r\n        out[k] = in[k] ^ rc4_next(\u0026ctx);\r\n    }\r\n}\r\n\r\nint main(void) {\r\n    const uint8_t key[] = \"this_is_a_rc4_key\";\r\n    const uint8_t msg[] = \"flag{rc4_demo}\";\r\n    size_t len = strlen((const char *)msg);\r\n\r\n    uint8_t *ct = malloc(len);\r\n    uint8_t *pt = malloc(len + 1);\r\n    if (!ct || !pt) return 1;\r\n\r\n    rc4_crypt(ct, msg, len, key, strlen((const char *)key), 0);\r\n    rc4_crypt(pt, ct, len, key, strlen((const char *)key), 0);\r\n    pt[len] = 0;\r\n\r\n    printf(\"cipher hex: \");\r\n    for (size_t i = 0; i \u003c len; i++) printf(\"%02x\", ct[i]);\r\n    printf(\"\\nplain: %s\\n\", pt);\r\n\r\n    free(ct);\r\n    free(pt);\r\n    return 0;\r\n}\r\n```\r\n\r\n编译：\r\n\r\n```\r\ngcc rc4_demo.c -o rc4_demo\r\n./rc4_demo\r\n```\r\n\r\n## 5. 例题里一般怎么用它\r\n\r\n### 5.1 密钥流复用\r\n\r\nRC4 最大的坑就是密钥流复用。如果同一个 key 加密两段消息：\r\n\r\n```\r\nC1 = P1 XOR K\r\nC2 = P2 XOR K\r\nC1 XOR C2 = P1 XOR P2\r\n```\r\n\r\n于是只要你知道其中一段明文的某些位置，就能把对应位置的密钥流抠出来，再去还原另一段消息。CTF 里常用 `flag{`、文件头、JSON 固定字段当已知明文：\r\n\r\n```\r\nknown_p1 = b\"flag{\"\r\nstream = bytes(c ^ p for c, p in zip(c1, known_p1))\r\nrecovered_p2 = bytes(c ^ k for c, k in zip(c2, stream))\r\n```\r\n\r\n### 5.2 明文头恢复\r\n\r\n文件题里 RC4 也挺常见，尤其是 PNG、ZIP、PDF 这种有固定文件头的东西。先把密文头和已知文件头 XOR，就能拿到前几字节密钥流，后面再继续拖明文猜测。常见文件头可以先记这几个：\r\n\r\n```\r\nPNG: 89504e470d0a1a0a\r\nZIP: 504b0304\r\nPDF: 25504446\r\nGIF: 47494638\r\n```\r\n\r\n### 5.3 逆向识别\r\n\r\n逆向题里最典型的形状就是两个循环：第一个循环从 0 到 255 初始化并按 key 交换，第二个循环处理输入，每字节更新 `i/j` 后 XOR。如果 key 是硬编码的，很多时候不用再想别的，把 key 提出来跑同一份 RC4 就完事。\r\n\r\n## 6. 易错点\r\n\r\nRC4 没有内置 IV，题目里要是给了 IV，多半是协议自己把 IV 拼进 key，或者拿它做了一层派生。Python 里还要注意 ARC4 对象是有状态的，加密完以后不能拿同一个对象从头解密，应该重新初始化。遇到 RC4-dropN 时，加解密两边丢弃的字节数也必须一致。C 语言实现尽量用 `uint8_t`，否则 `char` 的符号扩展会让人查半天。最后也要说一句，RC4 现在更适合学习和 CTF，不适合新项目继续用。\r\n\r\n## 7. 逆向和流量题排查流程\r\n\r\n遇到疑似 RC4 的题，我一般先找 `S[256]`。如果看到它被初始化成 `0,1,2,...,255`，下一步就去找 KSA 的 256 次交换，表达式通常长得像 `j = j + S[i] + key[i % key_len]`。再往后看 PRGA，每处理 1 字节就更新 `i/j` 并从 `S[S[i] + S[j]]` 一类位置取值。确认算法后再看有没有 drop，有没有把 key 写成 hex 文本，有没有先 `fromhex`。最后拿 `flag{`、`ctf{` 或文件头做一下 sanity check，比盲猜舒服很多。\r\n\r\n动态调试时可以偷个懒：如果程序是“读入密文 -\u003e RC4 解密 -\u003e 比较/输出”，那就别急着完整还原算法，先在比较函数、输出函数或者解密函数返回后下断点，看内存里的 buffer 有没有明文。很多入门逆向题根本不要求你把 RC4 写得多漂亮，只要你能在合适的位置把解密后的数据捞出来就行。\r\n\r\n### 7.1 快速识别伪代码\r\n\r\nRC4 伪代码经常长这样：\r\n\r\n```\r\nfor (i = 0; i \u003c 256; i++)\r\n    s[i] = i;\r\n\r\nfor (i = 0; i \u003c 256; i++) {\r\n    j = (j + s[i] + key[i % keylen]) \u0026 0xff;\r\n    swap(s[i], s[j]);\r\n}\r\n\r\nfor (n = 0; n \u003c len; n++) {\r\n    i = (i + 1) \u0026 0xff;\r\n    j = (j + s[i]) \u0026 0xff;\r\n    swap(s[i], s[j]);\r\n    out[n] = in[n] ^ s[(s[i] + s[j]) \u0026 0xff];\r\n}\r\n```\r\n\r\n如果题目把 `\u0026 0xff` 写成 `% 256`，或者把数组类型写成 `char` 导致符号扩展，仍然可以按 RC4 思路还原，只是 C 代码里要注意强制转 `uint8_t`。\r\n\r\n### 7.2 常见协议痕迹\r\n\r\nRC4 曾经出现在 WEP、早期 TLS、一些老式软件授权和游戏资源加密里。题目描述里要是出现 `ARCFOUR`、`arcfour-hmac`、`RC4-MD5`、`drop[768]`、`S box 256`、`ksa/prga` 这些词，就可以先把 RC4 脚本掏出来试试。\r\n\r\n## 8. 本篇离线脚本\r\n\r\n下面脚本可以直接保存为 `rc4_tool.py`。它只依赖 Python 标准库，支持 hex/base64/raw 三种输入输出，适合线下赛断网使用。\r\n\r\n```\r\n#!/usr/bin/env python3\r\nimport argparse\r\nimport base64\r\nimport sys\r\n\r\n\r\ndef decode_data(s: str, fmt: str) -\u003e bytes:\r\n    if fmt == \"hex\":\r\n        return bytes.fromhex(s.strip())\r\n    if fmt == \"base64\":\r\n        return base64.b64decode(s.strip())\r\n    return s.encode()\r\n\r\n\r\ndef encode_data(b: bytes, fmt: str) -\u003e str:\r\n    if fmt == \"hex\":\r\n        return b.hex()\r\n    if fmt == \"base64\":\r\n        return base64.b64encode(b).decode()\r\n    return b.decode(errors=\"replace\")\r\n\r\n\r\ndef rc4(data: bytes, key: bytes, drop: int = 0) -\u003e bytes:\r\n    if not key:\r\n        raise ValueError(\"key must not be empty\")\r\n    s = list(range(256))\r\n    j = 0\r\n    for i in range(256):\r\n        j = (j + s[i] + key[i % len(key)]) \u0026 0xff\r\n        s[i], s[j] = s[j], s[i]\r\n\r\n    i = j = 0\r\n\r\n    def gen() -\u003e int:\r\n        nonlocal i, j\r\n        i = (i + 1) \u0026 0xff\r\n        j = (j + s[i]) \u0026 0xff\r\n        s[i], s[j] = s[j], s[i]\r\n        return s[(s[i] + s[j]) \u0026 0xff]\r\n\r\n    for _ in range(drop):\r\n        gen()\r\n    return bytes(x ^ gen() for x in data)\r\n\r\n\r\ndef main() -\u003e None:\r\n    ap = argparse.ArgumentParser(description=\"RC4/ARC4 encrypt/decrypt tool\")\r\n    ap.add_argument(\"data\", help=\"input data\")\r\n    ap.add_argument(\"-k\", \"--key\", required=True, help=\"key string or hex key\")\r\n    ap.add_argument(\"--key-hex\", action=\"store_true\", help=\"treat key as hex\")\r\n    ap.add_argument(\"--in-fmt\", choices=[\"raw\", \"hex\", \"base64\"], default=\"hex\")\r\n    ap.add_argument(\"--out-fmt\", choices=[\"raw\", \"hex\", \"base64\"], default=\"hex\")\r\n    ap.add_argument(\"--drop\", type=int, default=0, help=\"drop first N keystream bytes\")\r\n    args = ap.parse_args()\r\n\r\n    key = bytes.fromhex(args.key) if args.key_hex else args.key.encode()\r\n    data = decode_data(args.data, args.in_fmt)\r\n    sys.stdout.write(encode_data(rc4(data, key, args.drop), args.out_fmt) + \"\\n\")\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    main()\r\n```\r\n\r\n使用示例：\r\n\r\n```\r\npython rc4_tool.py 00112233 -k secret --in-fmt hex --out-fmt hex\r\npython rc4_tool.py 2bbf... -k 736563726574 --key-hex --drop 3072\r\n```\r\n"])</script><script>self.__next_f.push([1,"1f:T48ca,"])</script><script>self.__next_f.push([1,"\r\nAES 和 DES 都是分组密码，但它们不是母子关系，更像前后两个时代的标准。DES 是 1970s 的产物，AES 是 2000s 后真正大量使用的主力。把它们放在一起讲，是因为逆向里很多工作不是“手推 AES”，而是识别程序用了什么库、什么模式、key/iv 从哪来，然后把同样的流程搬到 Python 里复现。\r\n\r\n\u003e DES 现在更像一个经典教材例子，有点像学汇编时绕不开 16 位实模式：不一定天天用，但很适合拿来理解结构。它是 Feistel 网络，64 bit 分组，16 轮，有效密钥 56 bit。\r\n\u003e\r\n\u003e AES 则是现代标准里的主力，SPN 结构，128 bit 分组，密钥可以是 128/192/256 bit。把它们放在一起看，不是为了少写一篇，虽然也确实少写了一篇（），而是因为很多 CTF 坑都不在算法核心，而在“分组密码怎么被拿来用”这一层。\r\n\r\n## 1. 逆向里先看什么\r\n\r\n遇到 AES/DES 题，第一反应不要是把算法公式背一遍，而是先把程序里的加密链路还原出来。很多题根本不是自己实现 AES，而是调用库；这时重点就是往上追 key、iv、mode、padding 从哪来。\r\n\r\n比较稳的顺序是：\r\n\r\n1. 先看导入表和字符串，判断是不是库调用。\r\n2. 再找模式字符串和参数，比如 `CBC`、`ECB`、`PKCS5Padding`、`AES_set_encrypt_key`。\r\n3. 然后追 key、iv、nonce、密文和明文来源。\r\n4. 最后才考虑算法内部，看它是不是自实现 AES/DES 或者魔改。\r\n\r\n如果是普通 Windows/Linux 程序，看到 `AES_set_encrypt_key`、`EVP_aes_128_cbc`、`CryptEncrypt`、`BCryptEncrypt`、`javax.crypto.Cipher`、`AES/CBC/PKCS5Padding` 这类东西，比去找 S 盒快得多。库调用题可以在 `EVP_DecryptUpdate`、`CryptDecrypt`、`BCryptDecrypt`、`Cipher.doFinal` 这类函数附近下断，观察传进去的 key、iv、密文和返回后的明文。\r\n\r\n如果没有明显库调用，再考虑搜常量。AES 自实现里可能有 S 盒表，开头常见：\r\n\r\n```\r\n63 7c 77 7b f2 6b 6f c5 ...\r\n```\r\n\r\nDES 自实现会有一堆 IP、E、P、S-box 表，数字表很多，看着像“密密麻麻的置换表”。新手不需要一眼认完所有表，能判断“这里大概率是 AES/DES 自实现”就够了，后面可以先动态调试看输入输出。\r\n\r\n实际做题时最重要的是复现链路。比如程序先 `md5(password)` 得到 16 字节 key，再从文件头取 16 字节 IV，最后 AES-CBC 解密资源，那脚本里也必须一模一样。少一步 hash、hex 解码方向错、IV 少截一字节，结果都会像“算法不对”，但其实只是参数没对齐。\r\n\r\n## 2. 总览对照\r\n\r\n| 特性 | DES (Data Encryption Standard) | AES (Advanced Encryption Standard) |\r\n|------|--------------------------------|-----------------------------------|\r\n| 网络结构 | Feistel 网络 | SPN (Substitution-Permutation Network) |\r\n| 分组长度 | 64 bit (8 字节) | 128 bit (16 字节) |\r\n| 密钥长度 | 64 bit 输入 (实际有效 56 bit) | 128 / 192 / 256 bit |\r\n| 轮数 | 16 轮 | 10 / 12 / 14 轮 |\r\n| 非线性来源 | 8 个 S 盒 (6bit -\u003e 4bit) | 字节 S 盒 (8bit -\u003e 8bit) |\r\n| 扩散方式 | E 扩展、P 置换、多轮左右交换 | ShiftRows、MixColumns |\r\n| 解密方式 | 与加密相同，仅子密钥倒序使用 | 使用对应的逆变换 |\r\n| 安全状态 | 单 DES 已不安全 | 正确使用时仍是主流标准 |\r\n\r\n它们的共同点其实很朴素：算法核心只管一个固定长度分组，DES 是 8 字节，AES 是 16 字节。真实消息一长，就必须靠工作模式把一块块串起来；ECB/CBC 这类模式还要处理 padding；只加密不认证时，密文被人改了也未必能发现。\r\n\r\n所以 CTF 里很少让你正面“打穿 AES”，更多是在模式、padding、nonce、IV、编码这些地方动手脚。逆向题也是一样，重点通常不是证明 AES 为什么安全，而是把程序怎么用 AES 这件事看明白。\r\n\r\n## 3. 工作模式和 Padding\r\n\r\n核心算法只处理一个 block，遇到很长的内容时，通常会走这样一条路：\r\n\r\n```\r\n明文 -\u003e padding -\u003e 切块 -\u003e 工作模式 -\u003e 密文\r\n```\r\n\r\nAES 和 DES 的很多坑都在这条链上。AES-CBC 和 DES-CBC 的思路也很像，区别主要是分组大小：AES 是 16 字节，DES 是 8 字节。\r\n\r\n### 3.1 ECB\r\n\r\nECB 是最直接的模式，每块明文独立加密：\r\n\r\n```\r\nC_i = E_K(P_i)\r\n```\r\n\r\n它的问题也很明显：相同明文块会产生相同密文块，结构藏不住。看到密文里重复块很多，就该怀疑 ECB。后面常见玩法就是块替换、cut-and-paste token，AES 里还经常考 byte-at-a-time。\r\n\r\n### 3.2 CBC\r\n\r\nCBC 每一块在加密前，先和上一块密文异或：\r\n\r\n```\r\nC_i = E_K(P_i XOR C_{i-1})\r\nP_i = D_K(C_i) XOR C_{i-1}\r\n```\r\n\r\n第一块没有上一块密文，所以要引入 IV。也正因为这个结构，改 IV 可以影响第一块明文，改 `C_{i-1}` 可以影响 `P_i`。padding oracle 也是从这里来的：服务端把 padding 对错泄露出来，攻击者就能一点点逼出明文。\r\n\r\n### 3.3 CTR\r\n\r\nCTR 不直接加密明文，而是加密 `nonce || counter`，生成密钥流后再和明文异或：\r\n\r\n```\r\nkeystream_i = E_K(nonce || counter_i)\r\nC_i = P_i XOR keystream_i\r\n```\r\n\r\nCTR 不需要 padding，但 nonce/counter 不能复用。复用后密钥流相同，两个密文一异或就会把密钥流抵消掉：\r\n\r\n```\r\nC1 XOR C2 = P1 XOR P2\r\n```\r\n\r\n### 3.4 GCM\r\n\r\nGCM 常用于 AES，可以先理解成：\r\n\r\n```\r\nGCM = CTR 加密 + GHASH 认证\r\n```\r\n\r\n它不只保护明文不被看见，也能发现密文有没有被改过。逆向里遇到 GCM 时，除了 key 和 nonce，还要注意 tag 和 AAD。GCM 也很怕 nonce 复用，严重时不只是泄露明文，还可能影响认证。\r\n\r\n### 3.5 Padding\r\n\r\nECB/CBC 要求明文长度是分组长度倍数，所以需要 padding。简单说，padding 就是“凑数”。AES 的 block 是 16 字节，DES 的 block 是 8 字节；如果明文装不满最后一块，就要补到刚好对齐。\r\n\r\nPKCS#7 的规则最常见：\r\n\r\n```\r\n缺 n 字节就补 n 个值为 n 的字节\r\n```\r\n\r\n比如 AES-CBC 还差 5 字节，就补 5 个 `0x05`。如果明文本来正好对齐，也要再补一整块。零填充、ISO/IEC 7816-4、NoPadding 也会遇到，但多数时候是解密后末尾不对劲，才回头检查具体是哪一种。\r\n\r\n| padding | 特点 |\r\n|---------|------|\r\n| PKCS#7 | 最常见，缺几字节就补几个对应值 |\r\n| Zero padding | 补 `\\x00` |\r\n| ISO/IEC 7816-4 | 先补 `0x80`，再补 `0x00` |\r\n| NoPadding | 输入必须已经对齐 |\r\n\r\n## 4. AES 逆向识别\r\n\r\nAES 的 block 固定是 16 字节，key 可以是 16、24、32 字节，对应 AES-128、AES-192、AES-256。轮数分别是 10、12、14。逆向里最常见的是 AES-128，也就是 16 字节 key、10 轮。\r\n\r\nAES-128 加密流程大概是：\r\n\r\n```\r\n明文 state\r\n -\u003e AddRoundKey(K0)\r\n -\u003e 9 轮:\r\n      SubBytes\r\n      ShiftRows\r\n      MixColumns\r\n      AddRoundKey\r\n -\u003e 最后一轮:\r\n      SubBytes\r\n      ShiftRows\r\n      AddRoundKey\r\n -\u003e 密文\r\n```\r\n\r\n最后一轮没有 `MixColumns`。这个点在看自实现 AES 时很有用，因为很多伪代码会表现出“前面循环 9 次，最后单独处理 1 次”的结构。\r\n\r\n几个常见识别点：\r\n\r\n1. AES S 盒开头常见 `63 7c 77 7b f2 6b 6f c5`。\r\n2. 密钥扩展里会出现 `RotWord`、`SubWord`、`Rcon`，常见轮常量有 `01 02 04 08 10 20 40 80 1b 36`。\r\n3. `MixColumns` 经常会出现 `0x02`、`0x03`、`0x1b` 这些有限域乘法相关操作。\r\n4. AES-128 常见 10 轮结构，AES-192 是 12 轮，AES-256 是 14 轮。\r\n5. 如果每次处理 16 字节，并且前面有一大张 256 字节表，就很值得怀疑 AES。\r\n\r\n需要注意的是，很多题不会把函数名留成 `aes_encrypt`。更常见的是一个普通函数里有循环、表查找、异或、16 字节状态变化。这个时候不要急着手算，先找输入输出：哪个 buffer 是明文，哪个 buffer 是密文，key 从哪来，最后比较的是哪一段。\r\n\r\n## 5. DES / 3DES 逆向识别\r\n\r\nDES 的 block 是 8 字节，key 输入看起来也是 8 字节，但每个字节里有 1 bit 是奇偶校验位，所以有效密钥只有 56 bit。它跑 16 轮 Feistel，解密时只要把子密钥倒序使用。\r\n\r\nDES 总流程可以粗略记成：\r\n\r\n```\r\n64 bit 明文\r\n -\u003e IP 初始置换\r\n -\u003e L0 || R0，各 32 bit\r\n -\u003e 16 轮 Feistel\r\n -\u003e R16 || L16\r\n -\u003e FP / IP^-1\r\n -\u003e 64 bit 密文\r\n```\r\n\r\n轮函数里会有 E 扩展、S 盒、P 置换：\r\n\r\n```\r\nR(32)\r\n -\u003e E 扩展置换，32 -\u003e 48\r\n -\u003e XOR 子密钥 Ki，48 bit\r\n -\u003e S 盒替代，8 * (6 -\u003e 4)\r\n -\u003e P 置换，32 bit\r\n```\r\n\r\n逆向里不需要一开始就背完 IP、E、P、PC-1、PC-2 每张表的内容。比较实用的判断方式是：看它是不是 8 字节一组、有没有 16 轮、有没有大量固定置换表和 8 个 S-box。只要判断出“这东西像 DES”，后面就可以围绕 key、mode、padding 去复现。\r\n\r\n3DES / DES-EDE 可以简单记成：\r\n\r\n```\r\nC = E_K3(D_K2(E_K1(P)))\r\n```\r\n\r\n3DES 的 key 常见两种长度：16 字节时一般是两密钥形式，实际按 `K1,K2,K1` 跑；24 字节时是三密钥形式，也就是 `K1,K2,K3`。3DES 比 DES 强，但 block 仍然只有 64 bit，新系统已经不建议继续使用。\r\n\r\n## 6. 复现时最容易错的地方\r\n\r\n做题时经常不是算法错，而是参数错。下面这些地方尤其容易踩坑：\r\n\r\n1. key 是原始字节，还是 hex 字符串。\r\n2. IV 是固定常量，还是从文件头、网络包、输入里截出来的。\r\n3. 模式到底是 ECB、CBC、CTR 还是 GCM。\r\n4. padding 是 PKCS#7、Zero padding，还是根本没有 padding。\r\n5. 明文或密文是不是又套了一层 base64、hex、URL encode。\r\n6. key 是不是经过 MD5、SHA1、SHA256、PBKDF 之类的派生。\r\n7. 程序初始化阶段有没有改全局变量，比如 TLS callback、init_array、JNI_OnLoad。\r\n8. 最终比较前是不是又做了异或、换表、压缩或反序。\r\n\r\n这里最典型的坑就是 hex：\r\n\r\n```\r\nkey = b\"00112233445566778899aabbccddeeff\"              # 32 字节 ASCII，AES-256\r\nkey = bytes.fromhex(\"00112233445566778899aabbccddeeff\") # 16 字节，AES-128\r\n```\r\n\r\n看起来都是一串 key，但长度完全不一样。DES key 必须 8 字节，AES key 必须 16/24/32 字节。长度不对时，先查编码和派生过程，不要马上怀疑算法。\r\n\r\n逆向里最稳的路线是先把“调用点”找出来。库调用题在加解密函数附近下断，自实现题在最终比较前下断，看程序拿什么东西和你的输入结果比较。这样做不丢人，逆向本来就是能动态拿就别硬熬静态。\r\n\r\n## 7. 做题时怎么接下去\r\n\r\n如果后面要继续写，不建议再往 AES 的数学细节里钻。更适合接一个完整的小例题，按下面这个顺序展开：\r\n\r\n1. 先贴关键伪代码，说明为什么怀疑 AES/DES。\r\n2. 标出识别点，比如 S 盒、Rcon、16 字节循环、`EVP_aes_128_cbc()`。\r\n3. 追 key、iv、ciphertext 从哪里来。\r\n4. 检查有没有初始化函数、TLS callback、反调试或全局变量修改。\r\n5. 写 Python 脚本复现解密。\r\n6. 如果第一次解不出来，说明怎么排查 mode、padding、hex/base64、大小端这些问题。\r\n\r\n也就是说，这篇文章到这里就够了：它负责讲“怎么认、怎么追、怎么复现”。真正让逆向能力涨起来的是后面的例题，而不是继续把有限域乘法推到更细。\r\n\r\n## 8. 代码实现：Python 调用留档\r\n\r\n安装：\r\n\r\n```\r\npip install pycryptodome\r\n```\r\n\r\n### 8.1 AES-CBC\r\n\r\n```\r\nfrom Crypto.Cipher import AES\r\nfrom Crypto.Util.Padding import pad, unpad\r\n\r\nkey = b\"0123456789abcdef\"\r\niv = b\"1234567890abcdef\"\r\npt = b\"flag{aes_demo}\"\r\n\r\nct = AES.new(key, AES.MODE_CBC, iv).encrypt(pad(pt, 16))\r\ngot = unpad(AES.new(key, AES.MODE_CBC, iv).decrypt(ct), 16)\r\nassert got == pt\r\n```\r\n\r\n### 8.2 DES-CBC\r\n\r\n```\r\nfrom Crypto.Cipher import DES\r\nfrom Crypto.Util.Padding import pad, unpad\r\n\r\nkey = b\"8bytekey\"\r\niv = b\"12345678\"\r\npt = b\"flag{des_demo}\"\r\n\r\nct = DES.new(key, DES.MODE_CBC, iv).encrypt(pad(pt, 8))\r\ngot = unpad(DES.new(key, DES.MODE_CBC, iv).decrypt(ct), 8)\r\nassert got == pt\r\n```\r\n\r\n### 8.3 AES-GCM\r\n\r\n```\r\nfrom Crypto.Cipher import AES\r\n\r\nkey = b\"0123456789abcdef\"\r\nnonce = b\"123456789012\"\r\naad = b\"header\"\r\npt = b\"flag{gcm_demo}\"\r\n\r\ncipher = AES.new(key, AES.MODE_GCM, nonce=nonce)\r\ncipher.update(aad)\r\nct, tag = cipher.encrypt_and_digest(pt)\r\n\r\ndec = AES.new(key, AES.MODE_GCM, nonce=nonce)\r\ndec.update(aad)\r\nassert dec.decrypt_and_verify(ct, tag) == pt\r\n```\r\n\r\nGCM 解密必须验证 tag。只 `decrypt()` 不 `verify()` 等于丢掉认证。\r\n\r\n## 9. 代码实现：C 语言 OpenSSL EVP 调用留档\r\n\r\nEVP 接口统一，AES/DES 只需要换 `EVP_aes_128_cbc()` 或 `EVP_des_cbc()`。\r\n\r\n```\r\n#include \u003copenssl/evp.h\u003e\r\n#include \u003cstdio.h\u003e\r\n#include \u003cstring.h\u003e\r\n\r\nint evp_crypt(const EVP_CIPHER *cipher, int enc,\r\n              const unsigned char *key, const unsigned char *iv,\r\n              const unsigned char *in, int in_len,\r\n              unsigned char *out, int *out_len) {\r\n    EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();\r\n    int len = 0, total = 0;\r\n    if (!ctx) return 0;\r\n    if (EVP_CipherInit_ex(ctx, cipher, NULL, key, iv, enc) != 1) return 0;\r\n    if (EVP_CipherUpdate(ctx, out, \u0026len, in, in_len) != 1) return 0;\r\n    total += len;\r\n    if (EVP_CipherFinal_ex(ctx, out + total, \u0026len) != 1) return 0;\r\n    total += len;\r\n    *out_len = total;\r\n    EVP_CIPHER_CTX_free(ctx);\r\n    return 1;\r\n}\r\n\r\nint main(void) {\r\n    const unsigned char aes_key[16] = \"0123456789abcdef\";\r\n    const unsigned char aes_iv[16] = \"1234567890abcdef\";\r\n    const unsigned char des_key[8] = \"8bytekey\";\r\n    const unsigned char des_iv[8] = \"12345678\";\r\n    const unsigned char msg[] = \"flag{evp_demo}\";\r\n    unsigned char ct[128], pt[128];\r\n    int ct_len = 0, pt_len = 0;\r\n\r\n    if (!evp_crypt(EVP_aes_128_cbc(), 1, aes_key, aes_iv, msg, (int)strlen((const char *)msg), ct, \u0026ct_len)) return 1;\r\n    if (!evp_crypt(EVP_aes_128_cbc(), 0, aes_key, aes_iv, ct, ct_len, pt, \u0026pt_len)) return 1;\r\n    pt[pt_len] = 0;\r\n    printf(\"AES plain: %s\\n\", pt);\r\n\r\n    if (!evp_crypt(EVP_des_cbc(), 1, des_key, des_iv, msg, (int)strlen((const char *)msg), ct, \u0026ct_len)) return 1;\r\n    if (!evp_crypt(EVP_des_cbc(), 0, des_key, des_iv, ct, ct_len, pt, \u0026pt_len)) return 1;\r\n    pt[pt_len] = 0;\r\n    printf(\"DES plain: %s\\n\", pt);\r\n    return 0;\r\n}\r\n```\r\n\r\n编译：\r\n\r\n```\r\ngcc aes_des_evp_demo.c -o aes_des_evp_demo -lcrypto\r\n```\r\n\r\nOpenSSL 3.x 中 DES 可能受 legacy provider 影响。如果报 `unsupported`，先检查 provider 配置。\r\n\r\n## 10. 代码实现：AES/DES 离线工具脚本留档\r\n\r\n保存为 `aes_des_tool.py`。依赖 `pycryptodome`，支持 AES、DES、3DES 的 ECB/CBC/CTR，以及 AES-GCM。\r\n\r\n```\r\n#!/usr/bin/env python3\r\nimport argparse\r\nfrom Crypto.Cipher import AES, DES, DES3\r\nfrom Crypto.Util.Padding import pad, unpad\r\n\r\n\r\ndef get_module(algo):\r\n    if algo == \"aes\":\r\n        return AES, 16\r\n    if algo == \"des\":\r\n        return DES, 8\r\n    return DES3, 8\r\n\r\n\r\ndef make_cipher(algo, mode, key, iv, nonce):\r\n    mod, _ = get_module(algo)\r\n    if mode == \"ecb\":\r\n        return mod.new(key, mod.MODE_ECB)\r\n    if mode == \"cbc\":\r\n        if iv is None:\r\n            raise ValueError(\"CBC needs --iv\")\r\n        return mod.new(key, mod.MODE_CBC, iv)\r\n    if mode == \"ctr\":\r\n        if nonce is None:\r\n            raise ValueError(\"CTR needs --nonce\")\r\n        return mod.new(key, mod.MODE_CTR, nonce=nonce)\r\n    if mode == \"gcm\":\r\n        if algo != \"aes\":\r\n            raise ValueError(\"GCM only supports AES here\")\r\n        if nonce is None:\r\n            raise ValueError(\"GCM needs --nonce\")\r\n        return AES.new(key, AES.MODE_GCM, nonce=nonce)\r\n    raise ValueError(\"bad mode\")\r\n\r\n\r\ndef main():\r\n    ap = argparse.ArgumentParser(description=\"AES/DES/3DES common mode tool\")\r\n    ap.add_argument(\"data\", help=\"hex data\")\r\n    ap.add_argument(\"-a\", \"--algo\", choices=[\"aes\", \"des\", \"3des\"], required=True)\r\n    ap.add_argument(\"-m\", \"--mode\", choices=[\"ecb\", \"cbc\", \"ctr\", \"gcm\"], default=\"cbc\")\r\n    ap.add_argument(\"-k\", \"--key\", required=True, help=\"hex key\")\r\n    ap.add_argument(\"--iv\", help=\"hex IV for CBC\")\r\n    ap.add_argument(\"--nonce\", help=\"hex nonce for CTR/GCM\")\r\n    ap.add_argument(\"--tag\", help=\"hex tag for GCM decrypt\")\r\n    ap.add_argument(\"--aad\", default=\"\", help=\"hex AAD for GCM\")\r\n    ap.add_argument(\"-d\", \"--decrypt\", action=\"store_true\")\r\n    ap.add_argument(\"--no-pad\", action=\"store_true\")\r\n    args = ap.parse_args()\r\n\r\n    key = bytes.fromhex(args.key)\r\n    data = bytes.fromhex(args.data)\r\n    iv = bytes.fromhex(args.iv) if args.iv else None\r\n    nonce = bytes.fromhex(args.nonce) if args.nonce else None\r\n    cipher = make_cipher(args.algo, args.mode, key, iv, nonce)\r\n    _, bs = get_module(args.algo)\r\n\r\n    if args.mode == \"gcm\" and args.aad:\r\n        cipher.update(bytes.fromhex(args.aad))\r\n\r\n    if args.decrypt:\r\n        if args.mode == \"gcm\":\r\n            if not args.tag:\r\n                raise ValueError(\"GCM decrypt needs --tag\")\r\n            out = cipher.decrypt_and_verify(data, bytes.fromhex(args.tag))\r\n        else:\r\n            out = cipher.decrypt(data)\r\n            if args.mode in (\"ecb\", \"cbc\") and not args.no_pad:\r\n                out = unpad(out, bs)\r\n    else:\r\n        if args.mode in (\"ecb\", \"cbc\") and not args.no_pad:\r\n            data = pad(data, bs)\r\n        if args.mode == \"gcm\":\r\n            out, tag = cipher.encrypt_and_digest(data)\r\n            print(\"tag=\" + tag.hex())\r\n        else:\r\n            out = cipher.encrypt(data)\r\n    print(out.hex())\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    main()\r\n```\r\n\r\n示例：\r\n\r\n```\r\npython aes_des_tool.py 666c61677b6165737d -a aes -k 30313233343536373839616263646566 --iv 31323334353637383930616263646566\r\npython aes_des_tool.py \u003ccipher_hex\u003e -a aes -k \u003ckey_hex\u003e --iv \u003civ_hex\u003e -d\r\npython aes_des_tool.py 666c61677b6465737d -a des -k 38627974656b6579 --iv 3132333435363738\r\npython aes_des_tool.py \u003ccipher_hex\u003e -a des -k 38627974656b6579 --iv 3132333435363738 -d\r\n```\r\n\r\n## 11. 参考资料\r\n\r\n* 参考博客 AES/DES 结构写法：https://goodapple.top/archives/162\r\n* NIST FIPS 197 AES：https://csrc.nist.gov/pubs/fips/197/final\r\n* NIST FIPS 46-3 DES：https://csrc.nist.gov/pubs/fips/46-3/final\r\n* PyCryptodome AES 文档：https://pycryptodome.readthedocs.io/en/stable/src/cipher/aes.html\r\n* PyCryptodome DES 文档：https://pycryptodome.readthedocs.io/en/stable/src/cipher/des.html\r\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L18\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"min-h-screen relative pb-10\",\"children\":[[\"$\",\"$L19\",null,{}],[\"$\",\"$L1a\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"w-full max-w-6xl mx-auto mt-24 sm:mt-28 p
